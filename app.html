<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno de ruta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#141B29; --muted:#566074; --line:#D6DCE6;
  --brand:#1F43A6; --brand-ink:#FFFFFF; --sun:#E3A015; --ok:#2F7A47; --warn:#B4472E;
  --k-visita:#1F43A6; --k-tour:#5E7F2F; --k-restaurante:#B83D63; --k-otro:#6B7280;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141D; --surface:#171E2B; --surface-2:#1D2535; --ink:#E8ECF3; --muted:#9AA4B6; --line:#2B3446;
    --brand:#86A2F0; --brand-ink:#0D1424; --sun:#F2BA45; --ok:#6CC08A; --warn:#EE8A6E;
    --k-visita:#86A2F0; --k-tour:#9DBE63; --k-restaurante:#EE7FA2; --k-otro:#A3AAB8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#171E2B; --surface-2:#1D2535; --ink:#E8ECF3; --muted:#9AA4B6; --line:#2B3446;
  --brand:#86A2F0; --brand-ink:#0D1424; --sun:#F2BA45; --ok:#6CC08A; --warn:#EE8A6E;
  --k-visita:#86A2F0; --k-tour:#9DBE63; --k-restaurante:#EE7FA2; --k-otro:#A3AAB8;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a{color:var(--brand)}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;padding:14px 0;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:115%;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:22px;height:22px;color:var(--brand)}
.status{font-size:.82rem;color:var(--muted)}
select.trip-sel{max-width:240px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:5px 10px;font-size:.84rem}
.btn.danger{color:var(--warn)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.55;cursor:default}

/* Hero */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(2rem,5.5vw,3.6rem);line-height:1.02;font-weight:850;font-stretch:118%;letter-spacing:-.02em;margin:0 0 6px}
.hero .sub{color:var(--muted);margin:0;font-size:1.05rem}
.hero-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap}
.stats{display:flex;gap:28px;margin:0}
.stats div{min-width:64px}
.stats dt{font-size:.8rem;color:var(--muted)}
.stats dd{margin:0;font-size:1.6rem;font-weight:800;font-stretch:110%;font-variant-numeric:tabular-nums}

/* Route line: the memorable element */
.route-wrap{overflow-x:auto;margin:26px -20px 0;padding:6px 20px 18px}
.route{list-style:none;margin:0;padding:0;display:flex;align-items:flex-start;min-width:max-content}
.node{display:flex;flex-direction:column;align-items:center;width:132px;text-align:center;position:relative}
.node .dot{width:26px;height:26px;border-radius:50%;background:var(--surface);border:6px solid var(--c);position:relative;z-index:1}
.node.home .dot{border-width:3px;border-style:dashed;border-color:var(--muted)}
.node .name{margin-top:10px;font-weight:750;font-stretch:108%;line-height:1.2;font-size:1rem;max-width:124px}
.node .when{font-size:.8rem;color:var(--muted)}
.node button{all:unset;cursor:pointer;display:contents}
.seg{flex:1 0 96px;min-width:96px;position:relative;height:26px;display:flex;align-items:center;justify-content:center}
.seg::before{content:"";position:absolute;left:-54px;right:-54px;top:10px;height:6px;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:3px}
.seg.missing::before{background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px)}
.seg .pill{position:relative;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;display:flex;gap:5px;align-items:center;font-size:.78rem;font-weight:650;cursor:pointer;color:var(--ink);white-space:nowrap;margin-top:-1px}
.seg .pill svg{width:16px;height:16px}
.seg.missing .pill{color:var(--muted);border-style:dashed}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs button{all:unset;cursor:pointer;padding:12px 14px;font-weight:650;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sun)}
.tabs button:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}

main{padding:24px 0 80px}
h2.sec{font-size:1.35rem;font-weight:800;font-stretch:110%;margin:0}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-head:first-child{margin-top:0}
.hint{color:var(--muted);font-size:.92rem;margin:4px 0 0}

/* Stops */
.stops{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.stop .band{height:8px;background:var(--c)}
.stop .in{padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
.stop h3{margin:0;font-size:1.25rem;font-weight:800;font-stretch:110%}
.stop .dates{font-size:.9rem;color:var(--muted)}
.lodge{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.92rem}
.lodge strong{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:auto}
.badge{font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.badge.no{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

/* Legs table-ish list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;padding:12px 14px;align-items:center;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.li .ic svg{width:22px;height:22px}
.li .t{font-weight:700}
.li .m{font-size:.86rem;color:var(--muted)}
.li .r{text-align:right;font-variant-numeric:tabular-nums}
.li .r .amt{font-weight:700}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* Calendar */
.months{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.month h3{margin:0 0 8px;font-weight:800;font-stretch:110%;text-transform:capitalize}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:.75rem;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{min-height:74px;border-radius:8px;background:var(--surface);border:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:2px;font-size:.75rem;text-align:left;cursor:default}
.cell.out{background:transparent;border-color:transparent;color:var(--muted);opacity:.5}
.cell.in{cursor:pointer;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.cell.in:hover{border-color:var(--c)}
.cell .n{font-weight:800;font-size:.9rem}
.cell .city{font-weight:650;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .mini{display:flex;gap:3px;align-items:center;margin-top:auto;color:var(--ink)}
.cell .mini svg{width:14px;height:14px}
.cell .cnt{font-size:.7rem;color:var(--muted)}
.cell.empty-stop{background:var(--surface);border-style:dashed}

/* Days */
.days{display:flex;flex-direction:column;gap:18px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:60px}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-left:6px solid var(--c);flex-wrap:wrap}
.day-h h3{margin:0;font-size:1.1rem;font-weight:800;font-stretch:108%}
.day-h .city{color:var(--muted);font-weight:600}
.day.sel{outline:3px solid var(--sun)}
.plan{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:10px 16px;border-top:1px solid var(--line);align-items:start}
.plan .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:.92rem;padding-top:1px}
.plan .kind{font-size:.75rem;font-weight:700;color:var(--k)}
.plan .t{font-weight:700}
.plan .notes{font-size:.88rem;color:var(--muted);white-space:pre-line}
.plan .r{text-align:right;font-variant-numeric:tabular-nums;font-size:.92rem}
.plan.leg{background:var(--surface-2)}
.plan.leg .kind{color:var(--ink)}
.plan .acts{display:flex;gap:2px;justify-content:flex-end;margin-top:4px}
.day-f{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* Ideas */
.ask{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.seg-ctl{display:flex;gap:6px;flex-wrap:wrap}
.seg-ctl label{cursor:pointer}
.seg-ctl input{position:absolute;opacity:0;pointer-events:none}
.seg-ctl span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:.9rem;background:var(--surface)}
.seg-ctl input:checked + span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg-ctl input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.ideas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:16px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.idea h4{margin:0;font-size:1.05rem;font-weight:800}
.idea .m{font-size:.84rem;color:var(--muted)}
.idea p{margin:0;font-size:.92rem}
.idea .tip{font-size:.86rem;border-left:3px solid var(--sun);padding-left:8px;color:var(--muted)}
.idea .row{margin-top:auto;padding-top:6px;justify-content:space-between}
.thinking{color:var(--muted);padding:18px 0}
.note{font-size:.84rem;color:var(--muted);margin-top:10px}

/* Costs */
.totals{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tot .l{font-size:.85rem;color:var(--muted)}
.tot .v{font-size:1.8rem;font-weight:850;font-stretch:112%;font-variant-numeric:tabular-nums;line-height:1.15}
.tot.big .v{font-size:2.4rem}
.meter{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.over i{background:var(--warn)}
.bars{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 90px;gap:12px;align-items:center;font-size:.92rem}
.bar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--c,var(--brand));border-radius:4px}
.bar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cols-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.cols{display:flex;gap:6px;align-items:flex-end;height:180px;min-width:max-content}
.col{width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.col i{display:block;width:100%;background:var(--c);border-radius:4px 4px 0 0;min-height:2px}
.col span{font-size:.72rem;color:var(--muted);white-space:nowrap}
.col b{font-size:.72rem;font-variant-numeric:tabular-nums}

/* Packing */
.two{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pack{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px}
.pack-i{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px}
.pack-i:hover{background:var(--surface-2)}
.pack-i input{width:18px;height:18px;accent-color:var(--brand)}
.pack-i.done span{text-decoration:line-through;color:var(--muted)}
.pack-i span{flex:1}
.addline{display:flex;gap:8px;padding:8px 10px}
.addline input{flex:1}
input.tx,select.tx,textarea.tx,.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea.tx{min-height:220px;resize:vertical;line-height:1.5}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,22,.5)}
.dlg-in{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
#cfm{width:min(440px,calc(100vw - 24px))}
#cfm h2{font-size:1.1rem;padding-bottom:14px}
.dlg-in h2{margin:0;padding:18px 20px 10px;font-size:1.3rem;font-weight:800;font-stretch:110%}
.dlg-body{padding:6px 20px 12px;overflow:auto;display:grid;gap:12px;grid-template-columns:1fr 1fr}
.dlg-body .full{grid-column:1/-1}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:4px;font-size:.86rem;font-weight:600}
.f span{color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:.92rem;font-weight:600;align-self:end;padding-bottom:9px}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.dlg-err{color:var(--warn);font-size:.9rem;grid-column:1/-1;margin:0}
.calcout{grid-column:1/-1;background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:.9rem}

/* Empty / welcome */
.welcome{padding:60px 0 40px;max-width:720px}
.welcome h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1;font-weight:850;font-stretch:120%;letter-spacing:-.02em;margin:0 0 16px}
.welcome p{font-size:1.1rem;color:var(--muted);margin:0 0 24px;max-width:56ch}
.feat{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:40px;color:var(--muted);font-size:.95rem}
.feat b{display:block;color:var(--ink);font-stretch:108%}

@media (max-width:640px){
  .wrap{padding:0 14px}
  .route-wrap{margin:20px -14px 0;padding:6px 14px 18px}
  .stats{gap:18px}
  .dlg-body{grid-template-columns:1fr}
  .cell{min-height:58px;padding:4px}
  .cell .city{font-size:.68rem}
  .bar{grid-template-columns:110px 1fr 76px}
  .plan{grid-template-columns:46px 1fr;}
  .plan .r{grid-column:2;text-align:left}
  .plan .acts{justify-content:flex-start}
}
@media (prefers-reduced-motion:no-preference){
  .route .node,.route .seg{animation:draw .5s ease-out both;animation-delay:calc(var(--i) * 70ms)}
  @keyframes draw{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
}
@media print{.tabs,.top,.btn{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="6" r="2.5"/><path d="M7.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7.5"/></svg>Cuaderno de ruta</div>
    <span class="status" id="status" aria-live="polite"></span>
    <span id="topctl" class="row"></span>
  </header>
</div>
<div id="app"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<dialog id="cfm" aria-label="Confirmar"></dialog>
<datalist id="cities"></datalist>

<script>
/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const D = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const iso = t => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => iso(D(s) + n * 864e5);
const diffDays = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const todayISO = () => { const d = new Date(); return iso(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); };
const fmt = (s, o) => new Date(D(s)).toLocaleDateString('es-ES', { timeZone: 'UTC', ...o });
const fmtShort = s => fmt(s, { day: 'numeric', month: 'short' });
const fmtDay = s => fmt(s, { weekday: 'long', day: 'numeric', month: 'long' });
const EUR = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const eur = n => EUR.format(Math.round(n || 0));
const norm = s => (s || '').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };

const CITIES = ['A Coruña','Albarracín','Alicante','Almería','Ávila','Badajoz','Barcelona','Bilbao','Burgos','Cáceres','Cádiz','Cartagena','Castellón','Córdoba','Costa Brava','Cuenca','Delta del Ebro','Donostia / San Sebastián','Formentera','Fuerteventura','Gijón','Girona','Gran Canaria','Granada','Huelva','Huesca','Ibiza','Jaén','Jerez de la Frontera','La Palma','Lanzarote','León','Lleida','Logroño','Lugo','Madrid','Málaga','Mallorca','Marbella','Menorca','Mérida','Murcia','Ourense','Oviedo','Pamplona','Picos de Europa','Pirineo aragonés','Pontevedra','Rías Baixas','Ronda','Salamanca','Santander','Santiago de Compostela','Segovia','Sevilla','Sierra Nevada','Sigüenza','Soria','Tarragona','Tenerife','Teruel','Toledo','Trujillo','Úbeda y Baeza','Valencia','Valladolid','Valle del Jerte','Vigo','Vitoria-Gasteiz','Zamora','Zaragoza'];
$('#cities').innerHTML = CITIES.map(c => `<option value="${esc(c)}">`).join('');

const PALETTE = ['#1F43A6', '#D0890F', '#5E7F2F', '#B83D63', '#13807D', '#6A4FB3', '#9A5B2B', '#2F6FB8'];

const SV = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const MODES = {

const HAY_SERVIDOR = typeof google !== 'undefined' && !!(google.script && google.script.run);
function run(fn, ...args) {
  return new Promise((res, rej) => {

let trips = [];
let curId = null;
let loaded = false;
let tab = 'ruta';

const dirty = new Set();
let saveTimer = null, saving = false;

function setStatus(t) { $('#status').textContent = t; }
function cur() { return trips.find(t => t.id === curId) || null; }

function touch(t) {
  t.updated = Date.now();
  dirty.add(t.id);
  if (!HAY_SERVIDOR) { setStatus('Sin conexión: los cambios no se guardan'); return; }
  setStatus('Guardando…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 800);
}
async function flush() {
  if (saving) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500); return; }
  saving = true;
  const ids = [...dirty]; dirty.clear();
  try {
    for (const id of ids) {
      const t = trips.find(x => x.id === id);
      if (t) await run('apiGuardarViaje', JSON.stringify(t));
    }
    setStatus(dirty.size ? 'Guardando…' : 'Guardado');
  } catch (e) {
    ids.forEach(i => dirty.add(i));
    setStatus('No se pudo guardar. Se reintentará con el próximo cambio.');
  } finally { saving = false; }
}
window.addEventListener('beforeunload', e => { if (dirty.size) { flush(); e.preventDefault(); e.returnValue = ''; } });

function cargar() {

  run('apiInicio').then(r => {

    ia = !!r.ia;
    const hoy = todayISO();

    loaded = true; setStatus(''); render();

}

}
const mapsDir = (a, b) => `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(a || '')}&destination=${encodeURIComponent(b || '')}&travelmode=driving`;
const mapsQ = (q, c) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([q, c].filter(Boolean).join(', '))}`;

/* ---------- Cálculos ---------- */
const sortedStops = t => [...(t.stops || [])].sort((a, b) => (a.from || '').localeCompare(b.from || ''));
const tripDays = t => { if (!validDate(t.start) || !validDate(t.end) || t.end < t.start) return []; const n = diffDays(t.start, t.end); return Array.from({ length: n + 1 }, (_, i) => addDays(t.start, i)); };
const nights = s => (validDate(s.from) && validDate(s.to)) ? Math.max(0, diffDays(s.from, s.to)) : 0;
function stopFor(t, day) {
  const st = sortedStops(t);
  return st.find(s => s.from <= day && day < s.to) || st.find(s => s.to === day) || null;
}
const trav = t => Math.max(1, t.travelers || 1);
function legCost(t, l) {
  if (l.mode === 'coche') return (l.km || 0) * (t.consumo || 0) / 100 * (t.fuel || 0) + (l.tolls || 0) + (l.cost || 0);
  return (l.cost || 0) * (l.perPerson ? trav(t) : 1);
}
const itemCost = (t, i) => (i.cost || 0) * (i.perPerson ? trav(t) : 1);
function costs(t) {
  const days = tripDays(t);
  const c = { alojamiento: 0, transporte: 0, actividades: 0, restaurantes: 0, otros: 0, comida: 0 };
  (t.stops || []).forEach(s => c.alojamiento += nights(s) * (s.price || 0));
  (t.legs || []).forEach(l => c.transporte += legCost(t, l));
  (t.items || []).forEach(i => {
    const v = itemCost(t, i);
    if (i.kind === 'restaurante') c.restaurantes += v;
    else if (i.kind === 'otro') c.otros += v;
    else c.actividades += v;
  });
  c.comida = (t.foodPerDay || 0) * trav(t) * days.length;
  c.total = c.alojamiento + c.transporte + c.actividades + c.restaurantes + c.otros + c.comida;
  return c;
}
function dayCost(t, d) {
  let v = 0;
  (t.stops || []).forEach(s => { if (s.from <= d && d < s.to) v += s.price || 0; });
  (t.legs || []).filter(l => l.date === d).forEach(l => v += legCost(t, l));
  (t.items || []).filter(i => i.date === d).forEach(i => v += itemCost(t, i));
  v += (t.foodPerDay || 0) * trav(t);

}
function stopColor(t, s) { return s?.color || PALETTE[0]; }

/* Ruta */
function vRuta(t) {

  const pending = [

    ...(t.items || []).filter(i => i.needsBooking && !i.booked).map(i => `${esc(i.title)}${i.date ? ', ' + fmtShort(i.date) : ''}`),
  ];
  const missing = countMissingLegs(t);

/* Calendario */
function vCal(t) {
  const days = tripDays(t);
  if (!days.length) return `<div class="empty">Pon fechas de inicio y fin en Ajustes para ver el calendario.</div>`;
  const first = D(t.start), last = D(t.end);
  const months = [];
  let y = new Date(first).getUTCFullYear(), m = new Date(first).getUTCMonth();
  const ly = new Date(last).getUTCFullYear(), lm = new Date(last).getUTCMonth();
  while (y < ly || (y === ly && m <= lm)) { months.push([y, m]); m++; if (m > 11) { m = 0; y++; } }

  return `<p class="hint" style="margin-top:0">Toca un día para ver y planificar lo que haces en él.</p><div class="months">${months.map(([yy, mm]) => {

    const dim = new Date(Date.UTC(yy, mm + 1, 0)).getUTCDate();
    let cells = '';
    for (let i = 0; i < offset; i++) cells += `<div class="cell out" aria-hidden="true"></div>`;
    for (let d = 1; d <= dim; d++) {
      const ds = iso(Date.UTC(yy, mm, d));
      if (ds < t.start || ds > t.end) { cells += `<div class="cell out"><span class="n">${d}</span></div>`; continue; }
      const s = stopFor(t, ds);
      const legs = (t.legs || []).filter(l => l.date === ds);
      const n = (t.items || []).filter(i => i.date === ds).length;
      cells += `<button class="cell in ${s ? '' : 'empty-stop'}" style="--c:${s ? stopColor(t, s) : 'var(--line)'}" data-act="go-day" data-day="${ds}" aria-label="${fmtDay(ds)}${s ? ', ' + esc(s.city) : ''}">
        <span class="n">${d}</span><span class="city">${s ? esc(s.city) : ''}</span>
        <span class="mini">${legs.map(l => (MODES[l.mode] || MODES.otro).icon).join('')}${n ? `<span class="cnt">${n} ${n === 1 ? 'plan' : 'planes'}</span>` : ''}</span></button>`;
    }
    return `<section class="month"><h3>${new Date(start).toLocaleDateString('es-ES', { month: 'long', year: 'numeric', timeZone: 'UTC' })}</h3>

/* Día a día */
function vDias(t) {
  const days = tripDays(t);
  if (!days.length) return `<div class="empty">Pon fechas de inicio y fin en Ajustes para planificar cada día.</div>`;
  return `<div class="days">${days.map((d, idx) => {
    const s = stopFor(t, d);
    const legs = (t.legs || []).filter(l => l.date === d).map(l => ({ type: 'leg', time: l.depart || '', l }));
    const items = (t.items || []).filter(i => i.date === d).map(i => ({ type: 'item', time: i.time || '', i }));
    const all = [...legs, ...items].sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
    return `<section class="day ${selDay === d ? 'sel' : ''}" id="d-${d}">
      <div class="day-h" style="border-left-color:${s ? stopColor(t, s) : 'var(--line)'}">
        <div><h3>Día ${idx + 1}, ${fmtDay(d)}</h3><span class="city">${s ? esc(s.city) : 'Sin etapa asignada'}</span></div>
        <span class="badge">${eur(dayCost(t, d))} estimado</span>
      </div>

      <div class="day-f">

        ${s ? `<button class="btn small ghost" data-act="ideas-stop" data-id="${s.id}">${IC.spark}Ideas para ${esc(s.city)}</button>` : ''}
      </div></section>`;
  }).join('')}</div>`;
}
function legPlan(t, l) {
  const m = MODES[l.mode] || MODES.otro;
  return `<div class="plan leg"><div class="time">${esc(l.depart || '')}</div>
    <div><div class="kind">${m.label}</div><div class="t">${esc(l.from)} a ${esc(l.to)}</div>

function itemPlan(t, i) {

/* Ideas */
const CATS = {
  visitar: { label: 'Qué ver', kind: 'visita', ask: 'lugares imprescindibles que visitar (monumentos, museos, barrios, miradores)' },
  tours: { label: 'Tours y rutas', kind: 'tour', ask: 'tours guiados, rutas a pie o en bici, senderismo y experiencias' },
  restaurantes: { label: 'Dónde comer', kind: 'restaurante', ask: 'restaurantes, bares de tapas y sitios para comer bien con platos típicos de la zona' },
  excursiones: { label: 'Excursiones cerca', kind: 'tour', ask: 'excursiones de un día a pueblos o espacios naturales cercanos (indica la distancia en coche)' },
};
function vIdeas(t) {
  const st = sortedStops(t);
  if (!st.length) return `<div class="empty">Añade una etapa en Ruta para pedir ideas de ese destino.</div>`;
  if (!ideasState.stopId || !st.find(s => s.id === ideasState.stopId)) ideasState.stopId = st[0].id;
  const s = st.find(x => x.id === ideasState.stopId);
  const key = s.id + '|' + ideasState.cat;
  const saved = t.ideas?.[key];
  return `
  <div class="ask">
    <div><div class="f"><span>Destino</span></div><div class="seg-ctl" role="radiogroup" aria-label="Destino">${st.map(x => `<label><input type="radio" name="istop" value="${x.id}" ${x.id === s.id ? 'checked' : ''} data-act="ideas-pick-stop"><span>${esc(x.city)}</span></label>`).join('')}</div></div>
    <div><div class="f"><span>Qué buscas</span></div><div class="seg-ctl" role="radiogroup" aria-label="Tipo">${Object.entries(CATS).map(([k, c]) => `<label><input type="radio" name="icat" value="${k}" ${k === ideasState.cat ? 'checked' : ''} data-act="ideas-pick-cat"><span>${c.label}</span></label>`).join('')}</div></div>
    <div class="row" style="align-items:flex-end">
      <label class="f" style="flex:1;min-width:220px"><span>Intereses y gustos</span><input class="tx" id="interests" value="${esc(t.interests || '')}" placeholder="Ej.: historia, naturaleza, vino, viajamos con niños"></label>
      <label class="f" style="min-width:150px"><span>Nivel de gasto</span><select class="tx" id="level">${['económico', 'medio', 'alto'].map(v => `<option ${t.level === v ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      ${ia ? (ideasState.loading
        ? `<button class="btn" data-act="ideas-stop-req">Detener</button>`
        : `<button class="btn primary" data-act="ask-ideas">${IC.spark}${saved ? 'Pedir otras ideas' : 'Pedir ideas'}</button>`) : ''}
    </div>
    ${!ia ? `<p class="note" style="margin:0">Para pedir ideas, añade una clave gratuita de Gemini en <button class="btn small ghost" data-act="settings" style="padding:2px 6px">Ajustes</button>. Mientras tanto, puedes añadir tus planes a mano en Día a día.</p>` : ''}
  </div>
  ${ideasState.loading ? `<div class="thinking" aria-live="polite">Buscando ideas para ${esc(s.city)}… puede tardar un poco.</div>` : ''}
  ${ideasState.error ? `<div class="thinking" style="color:var(--warn)">${esc(ideasState.error)}</div>` : ''}
  ${saved && !ideasState.loading ? `<div class="ideas">${saved.list.map((x, i) => ideaCard(t, s, x, i)).join('')}</div>
    <p class="note">Recomendaciones generadas automáticamente: comprueba horarios, precios y que los sitios sigan abiertos antes de ir.</p>` : ''}`;
}
function ideaCard(t, s, x, i) {
  const added = (t.items || []).some(it => it.ideaKey === s.id + '|' + norm(x.nombre));
  return `<article class="idea"><h4>${esc(x.nombre)}</h4>
    <div class="m">${[x.zona, x.duracion, x.precio_eur ? `unos ${eur(x.precio_eur)} por persona` : 'Gratis'].filter(Boolean).map(esc).join(', ')}</div>
    <p>${esc(x.descripcion)}</p>
    ${x.consejo ? `<div class="tip">${esc(x.consejo)}</div>` : ''}
    <div class="row"><span class="badge">${CATS[ideasState.cat].label}</span>
    <button class="btn small ${added ? '' : 'primary'}" data-act="add-idea" data-i="${i}">${added ? 'Añadido, añadir otra vez' : 'Añadir a un día'}</button></div></article>`;
}
async function askIdeas() {
  const t = cur(); const s = (t.stops || []).find(x => x.id === ideasState.stopId); if (!s || !ia) return;
  t.interests = $('#interests')?.value.trim() || ''; t.level = $('#level')?.value || 'medio'; touch(t);
  const cat = CATS[ideasState.cat]; const key = s.id + '|' + ideasState.cat;
  const prev = t.ideas?.[key]?.list?.map(x => x.nombre) || [];
  const month = validDate(s.from) ? fmt(s.from, { month: 'long' }) : '';
  const prompt = `Eres un experto en viajes por España. Recomienda ${cat.ask} en ${s.city} (España).
Contexto del viaje: ${nights(s)} noches en ${s.city}${month ? `, en ${month}` : ''}; ${trav(t)} viajeros; intereses: ${t.interests || 'generales'}; nivel de gasto: ${t.level || 'medio'}.
${prev.length ? `Evita repetir estas, ya sugeridas: ${prev.join('; ')}.` : ''}
Da exactamente 6 recomendaciones de sitios reales y conocidos. Si es un restaurante, prioriza sitios consolidados y menciona el tipo de cocina y algún plato.
Responde SOLO con JSON válido con esta forma, sin texto adicional:
{"ideas":[{"nombre":"","descripcion":"máximo 2 frases","zona":"barrio o zona","duracion":"p. ej. 2 h","precio_eur":0,"consejo":"consejo práctico corto (reservar, mejor hora, etc.)","reserva":false}]}
precio_eur es un número aproximado por persona (0 si es gratis). reserva es true si conviene reservar con antelación.`;
  const my = ++ideasState.token; ideasState.loading = true; ideasState.error = ''; render();
  try {
    const res = await run('apiIdeas', prompt);
    if (my !== ideasState.token) return;
    const list = (res?.ideas || []).filter(x => x && x.nombre).slice(0, 8).map(x => ({
      nombre: String(x.nombre), descripcion: String(x.descripcion || ''), zona: String(x.zona || ''), duracion: String(x.duracion || ''),
      precio_eur: num(x.precio_eur), consejo: String(x.consejo || ''), reserva: !!x.reserva }));
    if (!list.length) throw new Error('la respuesta llegó vacía.');
    t.ideas = t.ideas || {}; t.ideas[key] = { at: Date.now(), list }; touch(t);
  } catch (e) {
    if (my === ideasState.token) ideasState.error = 'No se pudieron obtener ideas: ' + (e?.message || 'vuelve a intentarlo.');
  } finally { if (my === ideasState.token) { ideasState.loading = false; render(); } }
}

/* Costes */
function vCostes(t) {
  const c = costs(t); const days = tripDays(t); const p = trav(t);
  const cats = [['Alojamiento', c.alojamiento, '#1F43A6'], ['Transporte', c.transporte, '#D0890F'], ['Actividades y tours', c.actividades, '#5E7F2F'], ['Restaurantes', c.restaurantes, '#B83D63'], ['Comidas sin planificar', c.comida, '#13807D'], ['Otros', c.otros, '#6B7280']];
  const max = Math.max(1, ...cats.map(x => x[1]));
  const per = days.map(d => [d, dayCost(t, d)]); const maxD = Math.max(1, ...per.map(x => x[1]));
  const budget = t.budget || 0; const pct = budget ? Math.min(100, c.total / budget * 100) : 0;
  return `
  <div class="totals">
    <div class="tot big"><div class="l">Total estimado</div><div class="v">${eur(c.total)}</div>
      ${budget ? `<div class="meter ${c.total > budget ? 'over' : ''}"><i style="width:${pct}%"></i></div>
      <div class="l" style="margin-top:6px">${c.total > budget ? `Te pasas ${eur(c.total - budget)} del presupuesto de ${eur(budget)}` : `Quedan ${eur(budget - c.total)} de ${eur(budget)}`}</div>` : `<div class="l" style="margin-top:6px"><button class="btn small" data-act="settings">Fijar presupuesto</button></div>`}</div>
    <div class="tot"><div class="l">Por persona</div><div class="v">${eur(c.total / p)}</div></div>
    <div class="tot"><div class="l">Por día</div><div class="v">${eur(days.length ? c.total / days.length : 0)}</div></div>
    <div class="tot"><div class="l">Por persona y día</div><div class="v">${eur(days.length ? c.total / p / days.length : 0)}</div></div>
  </div>
  <div class="sec-head"><h2 class="sec">Por categoría</h2></div>
  <div class="bars">${cats.map(([l, v, col]) => `<div class="bar" style="--c:${col}"><span>${l}</span><div class="track"><i style="width:${v / max * 100}%"></i></div><span class="v">${eur(v)}</span></div>`).join('')}</div>
  <p class="note">Comidas sin planificar usa ${eur(t.foodPerDay || 0)} por persona y día, aparte de los restaurantes que añadas. En coche: ${t.consumo || 0} l/100 km a ${(t.fuel || 0).toLocaleString('es-ES')} €/l. Cámbialo en <button class="btn small ghost" data-act="settings" style="padding:2px 6px">Ajustes</button></p>
  ${days.length ? `<div class="sec-head"><h2 class="sec">Por día</h2></div>
  <div class="cols-wrap"><div class="cols">${per.map(([d, v]) => { const s = stopFor(t, d); return `<button class="col" style="--c:${s ? stopColor(t, s) : 'var(--muted)'};all:unset;cursor:pointer;width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end" data-act="go-day" data-day="${d}" title="${fmtDay(d)}"><b>${Math.round(v)}</b><i style="height:${v / maxD * 130}px"></i><span>${fmt(d, { day: 'numeric', month: 'numeric' })}</span></button>`; }).join('')}</div></div>` : ''}`;
}

/* ---------- Diálogos ---------- */
const F = (label, name, val = '', type = 'text', extra = '', cls = '') => `<label class="f ${cls}"><span>${label}</span><input type="${type}" name="${name}" value="${esc(val ?? '')}" ${extra}></label>`;
const CK = (label, name, on) => `<label class="chk"><input type="checkbox" name="${name}" ${on ? 'checked' : ''}><span>${label}</span></label>`;
const SEL = (label, name, opts, val, cls = '') => `<label class="f ${cls}"><span>${label}</span><select name="${name}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
const TA = (label, name, val = '') => `<label class="f full"><span>${label}</span><textarea name="${name}" rows="3">${esc(val)}</textarea></label>`;
function readFields(root) {
  const v = {};
  root.querySelectorAll('[name]').forEach(el => { v[el.name] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? num(el.value) : el.value.trim(); });
  return v;
}
function openDialog({ title, body, onSave, saveLabel = 'Guardar', onMount }) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg-in"><h2 id="dlg-title">${esc(title)}</h2><div class="dlg-body">${body}<p class="dlg-err" id="dlg-err" hidden></p></div>
    <div class="dlg-actions"><button class="btn ghost" data-x="cancel">Cancelar</button><button class="btn primary" data-x="ok">${esc(saveLabel)}</button></div></div>`;
  dlg.showModal();
  onMount && onMount(dlg);
  dlg.onclick = e => {
    if (e.target === dlg) return dlg.close();
    const x = e.target.closest('[data-x]')?.dataset.x;
    if (x === 'cancel') dlg.close();
    if (x === 'ok') {
      const err = onSave(readFields(dlg));
      if (typeof err === 'string') { const p = $('#dlg-err'); p.textContent = err; p.hidden = false; return; }
      dlg.close(); render();
    }
  };
  dlg.onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); dlg.querySelector('[data-x="ok"]').click(); } };
}

function tripDialog(existing) {
  const t = existing || {};
  const s0 = addDays(todayISO(), 21);
  openDialog({
    title: existing ? 'Ajustes del viaje' : 'Nuevo viaje',
    saveLabel: existing ? 'Guardar' : 'Crear viaje',
    body: F('Nombre del viaje', 'name', t.name || '', 'text', 'placeholder="Ej.: Norte de España en verano" required', 'full')
      + F('Ciudad de salida', 'origin', t.origin ?? '', 'text', 'list="cities" placeholder="Ej.: Madrid"', 'full')
      + F('Primer día', 'start', t.start || s0, 'date') + F('Último día', 'end', t.end || addDays(s0, 6), 'date')
      + F('Viajeros', 'travelers', t.travelers ?? 2, 'number', 'min="1" step="1"') + F('Presupuesto total (€)', 'budget', t.budget || '', 'number', 'min="0" step="50" placeholder="Opcional"')
      + F('Comida diaria por persona (€)', 'foodPerDay', t.foodPerDay ?? 35, 'number', 'min="0" step="5"')
      + F('Consumo del coche (l/100 km)', 'consumo', t.consumo ?? 6.5, 'number', 'min="0" step="0.1"')
      + F('Precio del combustible (€/l)', 'fuel', t.fuel ?? 1.55, 'number', 'min="0" step="0.01"')
      + (HAY_SERVIDOR ? `<label class="f full"><span>Clave de Gemini para las ideas (opcional y gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com</a>)</span><input type="password" name="gemini" autocomplete="off" placeholder="${ia ? 'Ya hay una clave guardada' : 'Pega aquí tu clave'}"></label>${ia ? CK('Quitar la clave guardada', 'quitarClave', false) : ''}` : '')
      + (existing ? `<div class="full" style="margin-top:6px"><button class="btn small danger" data-act-dlg="del-trip">${IC.del}Borrar este viaje</button></div>` : ''),
    onMount: dlg => { dlg.querySelector('[data-act-dlg="del-trip"]')?.addEventListener('click', () => { dlg.close(); delTrip(); }); },
    onSave: v => {
      if (!v.name) return 'Ponle un nombre al viaje.';

      if (v.end < v.start) return 'El último día no puede ser anterior al primero.';
      if (diffDays(v.start, v.end) > 120) return 'El viaje no puede durar más de 120 días.';
      const target = existing || { id: uid(), stops: [], legs: [], items: [], packing: [], notes: '', ideas: {}, level: 'medio', interests: '', created: Date.now() };
      Object.assign(target, { name: v.name, origin: v.origin, start: v.start, end: v.end, travelers: Math.max(1, Math.round(v.travelers || 1)), budget: v.budget, foodPerDay: v.foodPerDay, consumo: v.consumo, fuel: v.fuel });
      if (!existing) { trips.unshift(target); curId = target.id; tab = 'ruta'; }
      if (v.gemini || v.quitarClave) run('apiGuardarClave', v.gemini || '', !!v.quitarClave).then(r => { ia = !!r; setStatus(ia ? 'Clave de Gemini guardada' : 'Clave de Gemini quitada'); render(); }).catch(() => setStatus('No se pudo guardar la clave'));
      touch(target);
    }
  });
}
async function delTrip() {
  const t = cur(); if (!t) return;
  if (!await confirmar(`¿Borrar el viaje “${t.name}”? No se puede deshacer.`)) return;
  trips = trips.filter(x => x.id !== t.id); curId = trips[0]?.id || null; dirty.delete(t.id);
  run('apiBorrarViaje', t.id).then(() => setStatus('Viaje borrado')).catch(() => setStatus('No se pudo borrar de la hoja'));
  render();
}

  openDialog({
    title: existing ? 'Editar traslado' : 'Nuevo traslado',
    body: pl + SEL('Medio', 'mode', Object.entries(MODES).map(([k, m]) => [k, m.label]), l.mode) + F('Fecha', 'date', l.date || t.start, 'date')
      + F('Desde', 'from', l.from || '', 'text', 'list="places"') + F('Hasta', 'to', l.to || '', 'text', 'list="places"')
      + F('Hora de salida', 'depart', l.depart || '', 'time') + F('Hora de llegada', 'arrive', l.arrive || '', 'time')
      + `<div class="full car-only" style="display:contents">`
      + F('Distancia (km)', 'km', l.km || '', 'number', 'min="0" step="1"', 'car') + F('Peajes (€)', 'tolls', l.tolls || '', 'number', 'min="0" step="0.5"', 'car')
      + `<div class="car full row"><button type="button" class="btn small" id="calc-km">Calcular km con Google Maps</button><a class="btn small ghost" id="ver-ruta" target="_blank" rel="noopener" href="#">Ver ruta</a><span id="calc-msg" class="hint" style="margin:0"></span></div>`
      + `<div class="calcout car" id="calcout"></div></div>`
      + F('Precio (€)', 'cost', l.cost || '', 'number', 'min="0" step="0.5"', 'nocar costlbl')
      + `<span class="nocar" style="display:contents">${CK('Precio por persona', 'perPerson', l.perPerson)}</span>`
      + `<span class="nocar" style="display:contents">${F('Localizador', 'ref', l.ref || '', 'text')}${CK('Reservado', 'booked', l.booked)}</span>`
      + TA('Notas', 'notes', l.notes || ''),
    onMount: dlg => {
      const upd = () => {
        const v = readFields(dlg); const car = v.mode === 'coche';
        dlg.querySelectorAll('.car').forEach(e => e.style.display = car ? '' : 'none');
        dlg.querySelectorAll('.nocar').forEach(e => { if (!e.classList.contains('costlbl')) e.style.display = car ? 'none' : 'contents'; });
        const vr = dlg.querySelector('#ver-ruta'); if (vr) vr.href = mapsDir(v.from, v.to);
        const lbl = dlg.querySelector('.costlbl span'); if (lbl) lbl.textContent = car ? 'Otros gastos: parking, alquiler… (€)' : 'Precio (€)';
        if (car) {
          const fuel = (v.km || 0) * (t.consumo || 0) / 100 * (t.fuel || 0);
          dlg.querySelector('#calcout').textContent = `Combustible ${eur(fuel)} + peajes ${eur(v.tolls)} + otros ${eur(v.cost)} = ${eur(fuel + (v.tolls || 0) + (v.cost || 0))} (con ${t.consumo} l/100 km a ${t.fuel} €/l)`;
        }
      };
      dlg.addEventListener('input', upd); dlg.addEventListener('change', upd); upd();
      dlg.querySelector('#calc-km').addEventListener('click', async () => {
        const v = readFields(dlg); const msg = dlg.querySelector('#calc-msg');
        if (!v.from || !v.to) { msg.textContent = 'Escribe primero el origen y el destino.'; return; }
        msg.textContent = 'Calculando…';
        try { const r = await run('apiDistancia', v.from, v.to); dlg.querySelector('[name=km]').value = r.km; msg.textContent = `${r.km} km, unas ${fmtDur(r.minutos)} de viaje`; upd(); }
        catch (e) { msg.textContent = (e && e.message) || 'No se pudo calcular.'; }
      });
    },
    onSave: v => {
      if (!v.from || !v.to) return 'Indica el origen y el destino.';
      if (!validDate(v.date)) return 'Indica la fecha del traslado.';
      if (v.mode === 'coche') { v.perPerson = false; v.booked = false; v.ref = ''; } else { v.km = 0; v.tolls = 0; }
      const target = existing || { id: uid() };
      Object.assign(target, v);
      if (!existing) t.legs.push(target);
      touch(t);
    }
  });
}

function itemDialog(existing, pre = {}) {
  const t = cur(); const i = existing || { kind: 'visita', perPerson: true, ...pre };
  const days = tripDays(t);
  openDialog({
    title: existing ? 'Editar plan' : 'Nuevo plan',
    body: SEL('Día', 'date', days.map((d, k) => [d, `Día ${k + 1}, ${fmt(d, { weekday: 'short', day: 'numeric', month: 'short' })}`]), i.date || days[0], 'full')
      + SEL('Tipo', 'kind', Object.entries(KINDS).map(([k, x]) => [k, x.label]), i.kind) + F('Hora', 'time', i.time || '', 'time')
      + F('Qué', 'title', i.title || '', 'text', 'placeholder="Ej.: Visita a la Alhambra"', 'full')
      + F('Coste (€)', 'cost', i.cost || '', 'number', 'min="0" step="0.5"') + CK('Coste por persona', 'perPerson', i.perPerson)
      + CK('Hay que reservar', 'needsBooking', i.needsBooking) + CK('Reservado', 'booked', i.booked)
      + F('Enlace', 'url', i.url || '', 'url', 'placeholder="https://"', 'full')
      + TA('Notas', 'notes', i.notes || ''),
    onSave: v => {
      if (!v.title) return 'Escribe qué vas a hacer.';
      if (v.url && !/^https?:\/\//i.test(v.url)) v.url = 'https://' + v.url;
      const target = existing || { id: uid(), ideaKey: pre.ideaKey || '' };
      Object.assign(target, v);
      if (!existing) t.items.push(target);
      selDay = v.date;
      touch(t);
    }
  });
}

      { id: uid(), date: d(3), time: '21:30', kind: 'restaurante', title: 'Tapas en el barrio de Santa Cruz', cost: 25, perPerson: true, notes: '', url: '' },
      { id: uid(), date: d(4), time: '11:00', kind: 'visita', title: 'Catedral y Giralda', cost: 13, perPerson: true, notes: '', url: '' },
      { id: uid(), date: d(4), time: '19:00', kind: 'tour', title: 'Atardecer en la Plaza de España y paseo por Triana', cost: 0, perPerson: true, notes: '', url: '' },
      { id: uid(), date: d(6), time: '08:30', kind: 'visita', title: 'Alhambra y Generalife', cost: 20, perPerson: true, needsBooking: true, booked: false, notes: 'Las entradas se agotan: reservar con semanas de antelación', url: '' },
      { id: uid(), date: d(6), time: '20:00', kind: 'tour', title: 'Mirador de San Nicolás al atardecer', cost: 0, perPerson: true, notes: '', url: '' },

  };

/* ---------- Exportar ---------- */
function eventos(t) {
  const ev = [];
  const fin = (hh, mas) => { const [a, b] = hh.split(':').map(Number); const m = Math.min(23 * 60 + 59, a * 60 + b + mas); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  (t.stops || []).forEach(s => validDate(s.from) && ev.push({ titulo: `${s.city}${s.lodging ? ': ' + s.lodging : ''}`, fecha: s.from, fechaFin: s.to > s.from ? s.to : addDays(s.from, 1), desc: [s.address, s.notes].filter(Boolean).join('\n') }));
  (t.legs || []).forEach(l => validDate(l.date) && ev.push({ titulo: `${(MODES[l.mode] || MODES.otro).label}: ${l.from} a ${l.to}`, fecha: l.date, hora: l.depart || '', horaFin: l.depart ? (l.arrive && l.arrive > l.depart ? l.arrive : fin(l.depart, 60)) : '', desc: [l.ref && 'Localizador ' + l.ref, l.notes].filter(Boolean).join('\n') }));
  (t.items || []).forEach(i => validDate(i.date) && ev.push({ titulo: i.title, fecha: i.date, hora: i.time || '', horaFin: i.time ? fin(i.time, 90) : '', desc: i.notes || '' }));
  return ev;
}
async function exportCal() {
  const t = cur(); if (!t) return;
  if (!await confirmar(`¿Crear el calendario “Viaje: ${t.name}” en tu Google Calendar? Si ya existe, se actualiza.`, 'Crear calendario')) return;
  setStatus('Creando el calendario…');
  try { const n = await run('apiCalendario', t.name || 'Viaje', JSON.stringify(eventos(t))); setStatus(`Calendario creado con ${n} eventos`); }
  catch (e) { setStatus('No se pudo crear el calendario: ' + (e.message || e)); }
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('dialog')) return;
  const act = b.dataset.act; const t = cur(); const id = b.dataset.id;
  switch (act) {
    case 'new-trip': return tripDialog(null);
    case 'example': { const x = exampleTrip(); trips.unshift(x); curId = x.id; tab = 'ruta'; touch(x); return render(); }
    case 'settings': return tripDialog(t);
    case 'export': return exportCal();
    case 'tab': tab = b.dataset.tab; if (tab !== 'dias') selDay = null; render(); window.scrollTo({ top: $('.tabs').offsetTop - 4 }); return;
    case 'add-stop': return stopDialog(null);
    case 'edit-stop': return stopDialog(t.stops.find(s => s.id === id));
    case 'del-stop': { const s = t.stops.find(x => x.id === id); if (s) confirmar(`¿Borrar la etapa ${s.city}?`).then(ok => { if (ok) { t.stops = t.stops.filter(x => x.id !== id); touch(t); render(); } }); return; }
    case 'ideas-stop': ideasState.stopId = id; ideasState.error = ''; tab = 'ideas'; render(); window.scrollTo({ top: $('.tabs').offsetTop - 4 }); return;
    case 'add-leg': return legDialog(null, { from: b.dataset.from || '', to: b.dataset.to || '', date: b.dataset.date || '' });
    case 'edit-leg': return legDialog(t.legs.find(l => l.id === id));
    case 'del-leg': confirmar('¿Borrar este traslado?').then(ok => { if (ok) { t.legs = t.legs.filter(l => l.id !== id); touch(t); render(); } }); return;
    case 'fill-legs': {
      const n = routeNodes(t);
      for (let i = 1; i < n.length; i++) if (!findLeg(t, n[i - 1], n[i])) {
        const date = n[i].stop ? n[i].stop.from : (n[i - 1].stop ? n[i - 1].stop.to : t.start);
        t.legs.push({ id: uid(), mode: 'coche', date, from: n[i - 1].name, to: n[i].name, depart: '', arrive: '', km: 0, tolls: 0, cost: 0, perPerson: false, booked: false, ref: '', notes: '' });
      }
      touch(t); render(); return;
    }
    case 'go-day': selDay = b.dataset.day; tab = 'dias'; return render();
    case 'add-item': return itemDialog(null, { date: b.dataset.day });
    case 'edit-item': return itemDialog(t.items.find(i => i.id === id));
    case 'del-item': t.items = t.items.filter(i => i.id !== id); touch(t); return render();
    case 'ask-ideas': return askIdeas();
    case 'ideas-stop-req': ideasState.token++; ideasState.loading = false; return render();
    case 'add-idea': {
      const s = t.stops.find(x => x.id === ideasState.stopId); const x = t.ideas?.[s.id + '|' + ideasState.cat]?.list?.[+b.dataset.i]; if (!x) return;
      const days = tripDays(t).filter(d => d >= s.from && d <= s.to);
      return itemDialog(null, { date: days[0] || t.start, kind: CATS[ideasState.cat].kind, title: x.nombre, cost: x.precio_eur || 0, perPerson: true, needsBooking: x.reserva,
        notes: [x.descripcion, x.zona && 'Zona: ' + x.zona, x.duracion && 'Duración: ' + x.duracion, x.consejo].filter(Boolean).join('\n'), ideaKey: s.id + '|' + norm(x.nombre) });
    }
    case 'pack-base': t.packing = BASE_PACK.map(x => ({ id: uid(), text: x, done: false })); touch(t); return render();
    case 'pack-add': return addPack();
    case 'pack-del': e.preventDefault(); t.packing = t.packing.filter(x => x.id !== id); touch(t); return render();
  }
});
document.addEventListener('change', e => {
  const el = e.target; const t = cur(); if (el.closest('dialog')) return;
  if (el.dataset.act === 'switch') { curId = el.value; selDay = null; ideasState = { stopId: null, cat: 'visitar', loading: false, error: '', token: ideasState.token + 1 }; return render(); }
  if (el.dataset.act === 'pack-toggle') { const p = t.packing.find(x => x.id === el.dataset.id); if (p) { p.done = el.checked; touch(t); el.closest('.pack-i').classList.toggle('done', el.checked); } return; }
  if (el.dataset.act === 'ideas-pick-stop') { ideasState.stopId = el.value; ideasState.error = ''; return render(); }
  if (el.dataset.act === 'ideas-pick-cat') { ideasState.cat = el.value; ideasState.error = ''; return render(); }
  if (el.id === 'level' || el.id === 'interests') { t.interests = $('#interests').value.trim(); t.level = $('#level').value; touch(t); }
});
document.addEventListener('input', e => { if (e.target.id === 'notes') { const t = cur(); t.notes = e.target.value; touch(t); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pack-new') { e.preventDefault(); addPack(); } });
function addPack() {
  const inp = $('#pack-new'); const v = inp?.value.trim(); if (!v) return;
  const t = cur(); t.packing = t.packing || []; t.packing.push({ id: uid(), text: v, done: false }); touch(t); render(); $('#pack-new')?.focus();
}

render();
cargar();
</script>
